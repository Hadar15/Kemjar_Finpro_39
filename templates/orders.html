<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders — ShopLab</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><nav class="nav wrap"><a class="brand" href="{{ url_for('home') }}">shop<span>lab</span><sup>®</sup></a><a href="{{ url_for('home') }}">Shop ↗</a></nav><main class="simple-page wrap"><p class="kicker">ACCOUNT / ORDER HISTORY</p><h1>Your <em>orders.</em></h1>{% for order in orders %}<a class="order-row" href="{{ url_for('order_detail', order_id=order.id) }}"><span>#{{ order.id }}<small>{{ order.created_at }}</small></span><span class="status">{{ order.status }}</span><strong>${{ '%.2f'|format(order.total_price) }} ↗</strong></a>{% else %}<p>No orders yet.</p>{% endfor %}</main></body></html>
