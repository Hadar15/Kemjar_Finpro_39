<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — ShopLab</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><nav class="nav wrap"><a class="brand" href="{{ url_for('home') }}">shop<span>lab</span><sup>®</sup></a><div class="nav-links"><a href="{{ url_for('orders') }}">Orders</a></div><a href="{{ url_for('logout') }}">Log out</a></nav>
<main class="simple-page wrap"><p class="kicker">ACCOUNT / PROFILE</p><h1>Your <em>details.</em></h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<p class="notice {{ category }}">{{ message }}</p>{% endfor %}{% endwith %}
<form method="post" class="auth-form"><label>Name<input name="name" value="{{ user.name }}" required></label><label>Email<input value="{{ user.email }}" disabled></label><label>Recipient name<input name="recipient_name" value="{{ address.recipient_name if address else '' }}" required></label><label>Phone<input name="phone" value="{{ address.phone if address else '' }}" required></label><label>Address<input name="address" value="{{ address.address if address else '' }}" required></label><label>City<input name="city" value="{{ address.city if address else '' }}" required></label><label>Postal code<input name="postal_code" value="{{ address.postal_code if address else '' }}" required></label><button class="dark-btn" type="submit">Save profile <span>↗</span></button></form></main></body></html>
